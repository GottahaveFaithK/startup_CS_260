<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dice Duel</title>
</head>

<body>
    <header>
        <h1>Dice Duel</h1>

        <nav>
            <a href="index.html">Play</a>
            <a href="leaderboard.html">Leaderboard</a>
            <a href="login.html">Login</a>
        </nav>
    </header>

    <main>
        <section>
            <h2>Opponent</h2>

            <img src="images/opponent-placeholder.png"
                 alt="Computer opponent">

            <h3>Computer</h3>
            <p>Score: <span>0</span></p>

            <p>"Let's see what you've got."</p>
        </section>

        <section>
            <h2>Computer Board</h2>

            <table>
                <tr>
                    <td>3</td>
                    <td>3</td>
                    <td></td>
                </tr>

                <tr>
                    <td>2</td>
                    <td></td>
                    <td>2</td>
                </tr>

                <tr>
                    <td></td>
                    <td>5</td>
                    <td></td>
                </tr>
            </table>
        </section>

        <section>
            <h2>Your Board</h2>

            <table>
                <tr>
                    <td>4</td>
                    <td></td>
                    <td>4</td>
                </tr>

                <tr>
                    <td></td>
                    <td>6</td>
                    <td></td>
                </tr>

                <tr>
                    <td>2</td>
                    <td>2</td>
                    <td>2</td>
                </tr>
            </table>

            <p>Your Score: <span>18</span></p>
        </section>

        <section>
            <h2>Current Die</h2>

            <div>
                <span>5</span>
            </div>

            <button>Roll Die</button>
        </section>
    </main>

    <footer>
        <p>Dice Duel | Created by Faith Kirkham</p>
        <a href="https://github.com/GottahaveFaithK/startup_CS_260">GitHub</a>
    </footer>
</body>
</html>
