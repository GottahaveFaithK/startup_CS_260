<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dice Duel</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <header class="site-header">
        <h1>Dice Duel</h1>

        <nav class="site-nav">
            <a href="index.html">Play</a>
            <a href="leaderboard.html">Leaderboard</a>
            <a href="login.html">Login</a>
        </nav>
    </header>
    <main class = "container game-table">
        <div class="row">
            <section class="game-panel col-md-4 order-1">
                <h2>Opponent</h2>

                <img src="images/Duck1.png"
                    alt="Computer opponent">

                <h3>Computer</h3>

                <p>"Let's see what you've got."</p>
            </section>

            <section class="game-panel col-md-8 board-panel order-2">
                <h2>Computer Board</h2>

                <table class="game-board">
                    <tr>
                        <td class="board-cell">
                            <span class="die die-one"></span>
                        </td>
                        <td class="board-cell">3</td>
                        <td class="board-cell"></td>
                    </tr>

                    <tr>
                        <td class="board-cell">2</td>
                        <td class="board-cell"></td>
                        <td class="board-cell">2</td>
                    </tr>

                    <tr>
                        <td class="board-cell"></td>
                        <td class="board-cell">5</td>
                        <td class="board-cell"></td>
                    </tr>
                </table>
            </section>

            <section class="game-panel col-md-4 order-4 order-md-3">
                <div>
                    <h2>Score</h2>

                    <p>Computer: <span>0</span></p>
                    <p>You: <span>18</span></p>
                </div>

                <div>
                    <h2>Current Die</h2>

                    <div>
                        <span>5</span>
                    </div>

                    <button>Roll Die</button>
                </div>
            </section>

            <section class="game-panel col-md-8 board-panel order-3 order-md-4">

            <table class="game-board">
                <tr>
                    <td class="board-cell">4</td>
                    <td class="board-cell"></td>
                    <td class="board-cell">4</td>
                </tr>

                <tr>
                    <td class="board-cell"></td>
                    <td class="board-cell">6</td>
                    <td class="board-cell"></td>
                </tr>

                <tr>
                    <td class="board-cell">2</td>
                    <td class="board-cell">2</td>
                    <td class="board-cell">2</td>
                </tr>
            </table>

                <h2>Your Board</h2>

            </section>

        </div>
    </main>

    <footer>
        <p>Dice Duel | Created by Faith Kirkham</p>
        <p>
            <a href="https://github.com/GottahaveFaithK/startup_CS_260">
                GitHub
            </a>
        </p>
    </footer>
</body>
</html>
